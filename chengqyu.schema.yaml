# Rime schema
# encoding: utf-8

schema:
  schema_id: chengqyu
  name: 西安話城區音
  version: "1.1.11"
  author:
    - 雪螢 SiqYin <siqyin@qq.com>（方案、詞庫轉換）
    - 字音來源：osfans/MCPDict《西安》數據表（國際音標）
  description: |
    西安話城區音（關中片）拼音輸入方案。
    音系：聲母 26（含零聲母；bf、pf 為城區音獨有）、韻母 39（uu、iae 為城區音獨有）、
    聲調四類——陰平 31、陽平 24、上聲 53、去聲 55。
    同倉庫另有西安話南郊音方案 nanjiao（聲母 25——rh 為南郊音獨有、韻母 37），兩套並行。
    拼寫以全拼為準，簡拼只在輸入端兼容（注音、詞庫仍寫全拼）；聲調不輸入，故輸入碼不含數字。
    詞庫字頭為繁體（同 Rime 社區慣例），默認按繁→簡表輸出簡體；切到「繁體」才原樣輸出。
    反查：`（反引號）起頭用普通話拼音，末綴 ; 可省；西安話拼音本身要用 q、x，故不再拿 Q、X 做反查前綴。
  dependencies:
    - luna_pinyin

switches:
  - name: ascii_mode
    reset: 0
    states: [漢字, 西文]
  - name: full_shape
    states: [半角, 全角]
  - name: ascii_punct
    states: [句讀, 符號]
  # 詞庫字頭存繁體，默認打開 simplification 由 simplifier 走 Rime 自帶的 t2s.json 轉簡體；切「繁體」才原樣輸出
  - options: [noop, simplification]
    states: [繁體, 简体]
    reset: 1

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - affix_segmentor@luna_pinyin
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - reverse_lookup_translator
    - script_translator@luna_pinyin
  filters:
    - simplifier
    - uniquifier
    - reverse_lookup_filter@chengqyu_reverse_lookup

speller:
  # 聲調不入碼：1/2/3/4 是選詞鍵，若也當輸入碼會撞上；alphabet 只留字母
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    # 聲調數碼去掉，不參與輸入
    - xform/\d//

    # ── 簡拼（零聲母只放行撮呼 yuo=>yo、yuen=>yun，其餘不簡）──
    #    不能寫成裸的 derive/uen/un/ 之類：那樣 "yuen 勻" 裏含 uen 或 "wo 窩" 會誤簡；必須用聲母錨點或撮呼限定
    - derive/^(bf|pf|zh|ch|sh|ng|[bpmfvdtnlzcsjqxrgh])ien(?=\d?$)/$1in/       # 今 jien => jin
    - derive/^(bf|pf|zh|ch|sh|ng|[bpmfvdtnlzcsjqxrgh])iou(?=\d?$)/$1iu/        # 究 jiou => jiu
    - derive/^(bf|pf|zh|ch|sh|ng|[bpmfvdtnlzcsjqxrgh])uo(?=\d?$)/$1o/          # 多 duo => do、剝 buo => bo、勿 vuo => vo
    - derive/^(bf|pf|zh|ch|sh|ng|[bpmfvdtnlzcsjqxrgh])uei(?=\d?$)/$1ui/       # 回 huei => hui
    - derive/^(bf|pf|zh|ch|sh|ng|[bpmfvdtnlzcsjqxrgh])uen(?=\d?$)/$1un/        # 孫 suen => sun
    - derive/^(bf|pf|zh|ch|sh|ng|[bpmfvdtnlzcsjqxrgh])uong(?=\d?$)/$1ung/      # 東 duong => dung
    - derive/yuo(?=\d?$)/yo/                                                   # 藥 yuo => yo、覺 jyuo => jyo
    - derive/yuen(?=\d?$)/yun/                                                 # 勻 yuen => yun、軍 jyuen => jyun

    # ── 撮呼 ü 的普通話式兼容寫法（默認關；等你定稿再開）──
    # - derive/^([jqx])yu(?=\d?$)/$1u/
    # - derive/^([jqx])yue(?=\d?$)/$1ue/
    # - derive/^([jqx])yuo(?=\d?$)/$1uo/
    # - derive/^([jqx])yuan(?=\d?$)/$1uan/
    # - derive/^([jqx])yuen(?=\d?$)/$1un/
    # - derive/^([jqx])yung(?=\d?$)/$1ong/
    # - derive/^([nl])yu(?=\d?$)/$1v/
    # - derive/^([nl])yuen(?=\d?$)/$1vn/

    # ── 聲母簡打（等詞庫做齊再開，避免單字層面同音爆掉）──
    # - abbrev/^([a-z]).+$/$1/
    # - abbrev/^(zh|ch|sh|bf|pf|ng).+$/$1/

# 主翻譯器
translator:
  dictionary: chengqyu
  prism: chengqyu
  spelling_hints: 2           # 前 2 個候選標注音（含調碼）
  contextual_suggestions: false
  # 注釋裏保留調號，方便照字表核音；要「候選不顯示聲調」就放開下一行
  # comment_format:
  #   - xform/\d//

# 副翻譯器：普通話拼音反查
# 前綴用反引號 `，寫法同 rime-cantonese 的 jyut6ping3（prefix: "`"，suffix: ";"）。
# 不能像吳語方案那樣用 Q：西安話拼音本身就有 qi qia qian qiang qiao qie qien qing qiou qyu…
# 若 Q 被佔作反查前綴，這些音節打頭就會被切成反查段，屬實打不出字。
# 完整清單（城區音 15 個）：qi qia qian qiang qiao qie qien qing qiou qyu qyuan qyue qyuen qyuo qyung
luna_pinyin:
  tag: luna_pinyin
  dictionary: luna_pinyin
  prefix: "`"
  suffix: ";"
  tips: 〔普通話〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

# 筆畫反查（原 X 起頭）已撤除：
# X 是西安話拼音的正式聲母（xi xia xian xiang xiao xie xien xing xiou xyu xyuan xyue xyuen xyuo xyung），
# 不能拿去做反查前綴；本方案也不再依賴 stroke 詞典與 table_translator@stroke。

# 反查濾鏡：反查結果顯示西安話城區音拼音
chengqyu_reverse_lookup:
  tags: [luna_pinyin]
  overwrite_comment: true
  dictionary: chengqyu
  comment_format:
    - xform/\s/ /

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    luna_pinyin: "^`[a-z']*;?$"
