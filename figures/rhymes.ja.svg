4" rx="6" fill="#fffbe6" stroke="#dcc05a"/><text x="631" y="590" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="start">yuong</text><text x="631" y="605" font-size="11" fill="#6b7b8c" font-weight="normal" text-anchor="start">[yoɣ̃]</text><text x="631" y="619" font-size="10.5" fill="#1b2a3a" font-weight="normal" text-anchor="start">容 yuong2</text><text x="18" y="675" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">鼻音韻母 an・en・ang・eng（および各呼の変種）は西安方言では鼻母音で、普通話のように -n / -ng で閉じません。</text><text x="18" y="694" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">uong / yuong は普通話の ong / iong に対応します。撮口呼はつねに y を伴い、声母の後でも省略しません（jyuen 軍、nyu 女）。</text><text x="18" y="713" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">城区音の uu・iai は南郊音で e・ie（胳 guu1→ge1、皆 jiai1→jie1）。南郊音の yua（髽 zyua4）は南郊音特有です。その他の韻</text><text x="18" y="732" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">母は両系統で同じです。</text>
