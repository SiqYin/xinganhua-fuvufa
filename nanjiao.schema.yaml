# Rime schema
# encoding: utf-8

schema:
  schema_id: nanjiao
  name: 西安話南郊音
  version: "1.1.1"
  author:
    - 雪螢 SiqYin <siqyin@qq.com>（方案、詞庫轉換）
    - 字音來源：南郊音字表（2026-11-20 重建：南郊裁定表 + 兩地一致讀音，套西安話音標折出）
  description: |
    西安話南郊音（關中片）拼音輸入方案。
    音系：聲母 25（含 rh；無 bf、pf——此二者為城區音獨有）、韻母 38（無 uu、iai）、
    聲調四類——陰平 21、陽平 24、上聲 53、去聲 44。
    同倉庫另有西安話城區音方案 chengqyu（聲母 26、韻母 40），兩套並行。
    拼寫以全拼為準，簡拼只在輸入端兼容（注音、詞庫仍寫全拼）；聲調不輸入，故輸入碼不含數字。
    詞庫字頭為繁體（同 Rime 社區慣例），默認輸出繁體；切到「簡體」才按繁→簡表轉出。
    反查：Q 起頭用普通話拼音，X 起頭用筆畫。
  dependencies:
    - luna_pinyin
    - stroke

switches:
  - name: ascii_mode
    reset: 0
    states: [漢字, 西文]
  - name: full_shape
    states: [半角, 全角]
  - name: ascii_punct
    states: [句讀, 符號]
  # 詞庫字頭存繁體，默認原樣輸出；第二檔打開 simplification，由 simplifier 走 Rime 自帶的 t2s.json 轉簡體
  - options: [noop, simplification]
    states: [繁體, 简体]
    reset: 0

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - affix_segmentor@luna_pinyin
    - affix_segmentor@stroke
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - reverse_lookup_translator
    - script_translator@luna_pinyin
    - table_translator@stroke
  filters:
    - simplifier
    - uniquifier
    - reverse_lookup_filter@nanjiao_reverse_lookup

speller:
  # 聲調不入碼：1/2/3/4 是選詞鍵，若也當輸入碼會撞上；alphabet 只留字母
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    # 聲調數碼去掉，不參與輸入
    - xform/\d//

    # ── 簡拼（零聲母只放行撮呼 yuen=>yun、yuong=>yung，其餘不簡）──
    #    不能寫成裸的 derive/uen/un/ 之類：那样 "yuong 容" 裏含 uong、"yuen 勻" 裏含 uen，會錯簡成 yung 以外的碼
    - derive/^(zh|ch|sh|ng|rh|[bpmfvdtnlzcsjqxrgh])ien(?=\d?$)/$1in/       # 今 jien => jin
    - derive/^(zh|ch|sh|ng|rh|[bpmfvdtnlzcsjqxrgh])ieng(?=\d?$)/$1ing/     # 明 mieng => ming
    - derive/^(zh|ch|sh|ng|rh|[bpmfvdtnlzcsjqxrgh])iou(?=\d?$)/$1iu/        # 究 jiou => jiu
    - derive/^(zh|ch|sh|ng|rh|[bpmfvdtnlzcsjqxrgh])uei(?=\d?$)/$1ui/       # 回 huei => hui
    - derive/^(zh|ch|sh|ng|rh|[bpmfvdtnlzcsjqxrgh])uen(?=\d?$)/$1un/        # 孫 suen => sun
    - derive/^(zh|ch|sh|ng|rh|[bpmfvdtnlzcsjqxrgh])uong(?=\d?$)/$1ung/      # 東 duong => dung
    - derive/yuen(?=\d?$)/yun/                                                 # 勻 yuen => yun、軍 jyuen => jyun
    - derive/yuong(?=\d?$)/yung/                                               # 容 yuong => yung、瓊 qyuong => qyung

    # ── 撮呼 ü 的普通話式兼容寫法（默認關；等你定稿再開）──
    # - derive/^([jqx])yu(?=\d?$)/$1u/
    # - derive/^([jqx])yue(?=\d?$)/$1ue/
    # - derive/^([jqx])yuo(?=\d?$)/$1uo/
    # - derive/^([jqx])yuan(?=\d?$)/$1uan/
    # - derive/^([jqx])yuen(?=\d?$)/$1un/
    # - derive/^([jqx])yuong(?=\d?$)/$1ong/
    # - derive/^([nl])yu(?=\d?$)/$1v/
    # - derive/^([nl])yuen(?=\d?$)/$1vn/

    # ── 聲母簡打（等詞庫做齊再開，避免單字層面同音爆掉）──
    # - abbrev/^([a-z]).+$/$1/
    # - abbrev/^(zh|ch|sh|ng).+$/$1/

# 主翻譯器
translator:
  dictionary: nanjiao
  prism: nanjiao
  spelling_hints: 8           # 前 8 個候選標注音（含調碼）
  contextual_suggestions: false
  # 注釋裏保留調號，方便照字表核音；要「單字不顯示聲調」就放開下一行
  # comment_format:
  #   - xform/\d//

# 副翻譯器 1：普通話拼音反查
luna_pinyin:
  tag: luna_pinyin
  dictionary: luna_pinyin
  prefix: "q"
  tips: 〔普通話〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

# 副翻譯器 2：筆畫反查
stroke:
  tag: stroke
  dictionary: stroke
  prefix: "x"
  tips: 〔筆畫〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/

# 反查濾鏡：反查結果顯示西安話南郊音拼音
nanjiao_reverse_lookup:
  tags: [luna_pinyin, stroke]
  overwrite_comment: true
  dictionary: nanjiao
  comment_format:
    - xform/\s/ /

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    luna_pinyin: "^q[a-z']*$"
    stroke: "^x[hspnz]*$"
