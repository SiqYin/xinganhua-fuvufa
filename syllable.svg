<svg xmlns="http://www.w3.org/2000/svg" width="908" height="440" viewBox="0 0 908 440" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
<rect width="908" height="440" fill="#ffffff"/>
<text x="24" y="30" font-size="17" fill="#1b2a3a" font-weight="bold" text-anchor="start">音节结构：声母 + 韵母 + 调号</text><text x="24" y="52" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">韵母含介音；零声母不写字母，齐呼改 y、合呼改 w、撮呼照写 yu-</text><rect x="24" y="70" width="84" height="22" rx="4" fill="#eef2f6" stroke="#c9d4de"/><text x="66" y="86" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">声母</text><rect x="116" y="70" width="124" height="22" rx="4" fill="#eef2f6" stroke="#c9d4de"/><text x="178" y="86" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">韵母</text><rect x="248" y="70" width="58" height="22" rx="4" fill="#eef2f6" stroke="#c9d4de"/><text x="277" y="86" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">调号</text><rect x="314" y="70" width="208" height="22" rx="4" fill="#eef2f6" stroke="#c9d4de"/><text x="418" y="86" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="middle">例字</text><rect x="24" y="96" width="84" height="38" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="66" y="121" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">b</text><rect x="116" y="96" width="124" height="38" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="178" y="121" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">a</text><rect x="248" y="96" width="58" height="38" rx="6" fill="#fff4f0" stroke="#c9d4de"/><text x="277" y="121" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">1</text><text x="318" y="121" font-size="12.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">巴</text><rect x="24" y="144" width="84" height="38" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="66" y="169" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">t</text><rect x="116" y="144" width="124" height="38" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="178" y="169" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">ian</text><rect x="248" y="144" width="58" height="38" rx="6" fill="#fff4f0" stroke="#c9d4de"/><text x="277" y="169" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">1</text><text x="318" y="169" font-size="12.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">天</text><rect x="24" y="192" width="84" height="38" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="66" y="217" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">bf</text><rect x="116" y="192" width="124" height="38" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="178" y="217" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">eng</text><rect x="248" y="192" width="58" height="38" rx="6" fill="#fff4f0" stroke="#c9d4de"/><text x="277" y="217" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">4</text><text x="318" y="217" font-size="12.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">中</text><rect x="24" y="240" width="84" height="38" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="66" y="265" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">j</text><rect x="116" y="240" width="124" height="38" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="178" y="265" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">yuen</text><rect x="248" y="240" width="58" height="38" rx="6" fill="#fff4f0" stroke="#c9d4de"/><text x="277" y="265" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">1</text><text x="318" y="265" font-size="12.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">軍</text><rect x="24" y="288" width="84" height="38" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="66" y="313" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">—</text><rect x="116" y="288" width="124" height="38" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="178" y="313" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">a</text><rect x="248" y="288" width="58" height="38" rx="6" fill="#fff4f0" stroke="#c9d4de"/><text x="277" y="313" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">1</text><text x="318" y="313" font-size="12.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">阿（零声母）</text><rect x="24" y="336" width="84" height="38" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="66" y="361" font-size="15" fill="#1b2a3a" font-weight="bold" text-anchor="middle">—</text><rect x="116" y="336" width="124" height="38" rx="6" fill="#f7fafc" stroke="#c9d4de"/><text x="178" y="361" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">you</text><rect x="248" y="336" width="58" height="38" rx="6" fill="#fff4f0" stroke="#c9d4de"/><text x="277" y="361" font-size="15" fill="#1b2a3a" font-weight="normal" text-anchor="middle">1</text><text x="318" y="361" font-size="12.5" fill="#6b7b8c" font-weight="normal" text-anchor="start">有（零声母 iɤu → you）</text><rect x="554" y="90" width="330" height="296" rx="8" fill="#fffbe6" stroke="#dcc05a"/><text x="568" y="116" font-size="13.5" fill="#1b2a3a" font-weight="bold" text-anchor="start">音节边界：撇号</text><text x="568" y="140" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">两个音节连写会被切错时加 '，与普通话</text><text x="568" y="159" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">xi'an 同一个道理。本方案最典型的例子就是</text><text x="568" y="178" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">「西安」本身：</text><text x="568" y="197" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start"></text><text x="568" y="216" font-size="12" fill="#1b2a3a" font-weight="bold" text-anchor="start">    西 xi1 + 安 ngan1  →  xi'ngan1</text><text x="568" y="235" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start"></text><text x="568" y="254" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">若连写成 xingan，就能被重新切成</text><text x="568" y="273" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">xin（心的简拼）+ gan（干），所以必须加撇号。</text><text x="568" y="292" font-size="12" fill="#6b7b8c" font-weight="normal" text-anchor="start">仓库名 xinganhua-fuvufa 因此去掉了撇号。</text>
</svg>
